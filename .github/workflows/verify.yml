name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main, fork-development]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/check-public-source.py --tracked-only
      - run: cd frontend && npm ci && npm run build
      - run: go test ./...
      - run: python3 -m unittest discover -s installer/tests -v
