name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main, fork-development]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/check-public-source.py --tracked-only
      - run: cd frontend && npm ci && npm run build
      # A failed test is repeated as an annotation, so the reason is on the run
      # page itself and does not need the log.
      - name: go test ./...
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log || {
            grep -E '^\s*--- FAIL|^FAIL|^panic:|_test\.go:[0-9]+:' go-test.log | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: python3 -m unittest discover -s installer/tests -v
